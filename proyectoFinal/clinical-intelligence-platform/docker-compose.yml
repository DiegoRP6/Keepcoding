services:
  db:
    image: postgres:16-alpine
    container_name: clinical-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinical-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinical-ai-backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      APP_NAME: Clinical Intelligence Platform
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/clinical_ai
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      - db
    networks:
      - clinical-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinical-ai-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - clinical-network

volumes:
  postgres_data:
  whisper_cache:

networks:
  clinical-network:
    driver: bridge